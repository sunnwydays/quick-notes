<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- resizes-content: when the keyboard opens, the page shrinks to fit above it -->
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta name="theme-color" content="#ffffff">
  <title>Quick Notes</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="home">
    <div class="sync-row">
      <span id="sync-status"></span>
      <div class="small-buttons">
        <button id="add-project-btn">+ project</button>
        <button id="export-btn">Export</button>
        <button id="login-btn">Log in</button>
      </div>
    </div>
    <div class="search-row">
      <input id="search" type="search" placeholder="Search notes" autocomplete="off" enterkeyhint="search">
      <button id="search-clear" hidden>Clear</button>
    </div>
    <div id="search-results" hidden></div>
    <div id="categories" class="grid"></div>
    <button id="read-btn">Read</button>
  </section>

  <section id="login" hidden>
    <div class="bar">
      <button class="back">Back</button>
      <h1>Log in</h1>
    </div>
    <p>Log in with the same email on each device to sync notes between them.</p>
    <form id="email-form">
      <input id="email" type="email" autocomplete="email" placeholder="Email" required>
      <button class="primary">Send code</button>
    </form>
    <form id="code-form" hidden>
      <p id="code-sent"></p>
      <input id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="Code from email" required>
      <button class="primary">Log in</button>
    </form>
    <p id="login-msg"></p>
  </section>

  <section id="editor" hidden>
    <div class="bar">
      <h1 id="editor-title"></h1>
      <button id="discard-btn">Discard</button>
      <button id="save-btn" class="primary">Save</button>
    </div>
    <textarea id="text" autocapitalize="sentences"></textarea>
    <label class="split-toggle">
      <input id="split" type="checkbox">
      Split each line into its own note
    </label>
  </section>

  <section id="entries" hidden>
    <div class="bar">
      <h1 id="entries-title"></h1>
      <button id="add-btn">Add</button>
      <button class="back">Back</button>
    </div>
    <div class="tools">
      <button id="remove-project-btn" hidden>Remove project</button>
      <button id="copy-btn">Copy all</button>
      <button id="times-btn">Show times</button>
    </div>
    <div id="entries-list"></div>
  </section>

  <div id="undo-bar" hidden>
    <span id="undo-msg"></span>
    <button id="undo-btn">Undo</button>
  </div>

  <script src="data.js"></script>
  <script src="views.js"></script>
  <script src="gestures.js"></script>
  <script src="home.js"></script>
  <script src="search.js"></script>
  <script src="editor.js"></script>
  <script src="entries.js"></script>
  <script src="export.js"></script>
  <script src="sync.js"></script>
  <script src="login.js"></script>
  <script src="main.js"></script>
</body>
</html>
