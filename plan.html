<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eaf6ff">
  <title>Week planner · Dash</title>
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="plan.css">
</head>
<body>
  <main id="planner">
    <header class="masthead">
      <div>
        <a class="dash-link" href="./">← Dash</a>
        <h1>Week planner</h1>
      </div>
      <div class="actions">
        <button id="week-prev" type="button" aria-label="Previous week">‹</button>
        <button id="week-today" type="button">This week</button>
        <button id="week-next" type="button" aria-label="Next week">›</button>
        <button id="plan-now" type="button">Now…</button>
        <button id="day-review" type="button" hidden>Review today</button>
        <button class="primary" id="save-week" type="button">Save to Dash</button>
        <button id="sync-status" type="button"></button>
        <button id="login-btn" type="button" hidden>Log in</button>
        <button id="hard-refresh" type="button" aria-label="Hard refresh" title="Hard refresh">⟳</button>
      </div>
    </header>
    <div class="week-overview">
      <h2 id="week-range"></h2>
      <p class="muted" id="week-unmarked"></p>
      <p class="muted" id="plan-status" role="status"></p>
      <section id="goals" aria-label="Working on"></section>
    </div>
    <nav id="day-tabs" aria-label="Day"></nav>
    <div class="board-scroll">
      <section id="week" aria-labelledby="week-range"></section>
    </div>
  </main>
  <section id="login" class="panel" aria-labelledby="login-title" hidden>
    <button id="login-back" type="button">← Planner</button>
    <h1 id="login-title">Log in</h1>
    <p>Use the same email as Dash to sync your notes.</p>
    <form id="email-form">
      <label>Email <input id="email" type="email" autocomplete="email" required></label>
      <button class="primary">Send code</button>
    </form>
    <form id="code-form" hidden>
      <p id="code-sent"></p>
      <label>Code <input id="code" inputmode="numeric" autocomplete="one-time-code" required></label>
      <button class="primary">Log in</button>
    </form>
    <p id="login-msg" role="status"></p>
  </section>
  <dialog id="block-editor" aria-labelledby="block-editor-title">
    <form id="block-form">
      <h2 id="block-editor-title">Add item</h2>
      <label>Item <input name="text" required autofocus placeholder="e.g. Gym, or Lab 3 intro written"></label>
      <p id="block-where" class="muted"></p>
      <details id="block-more">
        <summary>More</summary>
        <div class="more-fields">
          <label>Next <input name="next" placeholder="First step for the next block"></label>
          <div class="field-row">
            <label>Length <select name="size"></select></label>
            <label>Tier <select name="tier"></select></label>
          </div>
          <div class="field-row">
            <label>Goal <select name="goal"></select></label>
            <label>Tail (min) <input name="tail" type="number" min="0" max="120" step="5"></label>
          </div>
          <label>Kind <select name="kind"></select></label>
          <div id="pin-fields" class="field-row pin-fields">
            <label><input name="pin" type="checkbox"> Pin time</label>
            <label>Time <input name="time" type="time"></label>
          </div>
        </div>
      </details>
      <p id="block-error" class="warning" role="alert" hidden></p>
      <div class="actions">
        <button type="submit" class="primary">Apply</button>
        <button id="block-cancel" type="button">Cancel</button>
        <button id="block-over" type="button">Ran over…</button>
        <button id="block-delete" type="button">Delete</button>
      </div>
    </form>
  </dialog>
  <dialog id="template-editor" aria-labelledby="template-title">
    <form id="template-form">
      <h2 id="template-title">Day template</h2>
      <label>Template <select name="template"></select></label>
      <p id="template-note" class="muted"></p>
      <div id="event-fields" hidden>
        <label>Event name <input name="event"></label>
        <div class="field-row">
          <label>Starts <input name="start" type="time"></label>
          <label>Length <select name="duration"></select></label>
        </div>
      </div>
      <p id="template-error" class="warning" role="alert" hidden></p>
      <div class="actions">
        <button class="primary">Apply template</button>
        <button id="template-cancel" type="button">Cancel</button>
      </div>
    </form>
  </dialog>
  <dialog id="goal-editor" aria-labelledby="goal-title">
    <form id="goal-form">
      <h2 id="goal-title">Goal budget</h2>
      <label>Weekly hours <input name="hours" type="number" min="0" max="168" step="0.25" placeholder="No budget"></label>
      <label>Colour <select name="colour"></select></label>
      <div class="actions">
        <button class="primary">Apply</button>
        <button id="goal-cancel" type="button">Cancel</button>
      </div>
    </form>
  </dialog>
  <dialog id="restack-editor" aria-labelledby="restack-title">
    <form id="restack-form">
      <h2 id="restack-title"></h2>
      <p id="restack-text" class="muted"></p>
      <label>Time <input name="time" type="time" required autofocus></label>
      <label id="restack-reason">Reason <input name="reason" placeholder="Optional"></label>
      <p id="restack-error" class="warning" role="alert" hidden></p>
      <div class="actions">
        <button type="submit" class="primary">Restack day</button>
        <button id="restack-cancel" type="button">Cancel</button>
      </div>
    </form>
  </dialog>
  <dialog id="now-editor" aria-labelledby="now-title">
    <form id="now-form">
      <h2 id="now-title">Now…</h2>
      <label id="now-source">Todo <select name="todo"></select></label>
      <label>Block title <input name="title" required autofocus></label>
      <label>Minutes <input type="number" name="duration" min="1" max="180" required></label>
      <p id="now-error" class="warning" role="alert" hidden></p>
      <div class="actions">
        <button class="primary">Fit into today</button>
        <button id="now-cancel" type="button">Cancel</button>
      </div>
    </form>
  </dialog>
  <dialog id="review-editor" aria-labelledby="review-title">
    <form id="review-form">
      <h2 id="review-title"></h2>
      <p id="review-empty" class="muted" hidden>No timed blocks today.</p>
      <div id="review-list"></div>
      <div class="actions">
        <button class="primary">Apply NEXT</button>
        <button id="review-cancel" type="button">Close</button>
      </div>
    </form>
  </dialog>
  <div id="plan-undo" role="status" hidden>
    <span id="plan-undo-msg"></span>
    <button id="plan-undo-btn" type="button">Undo</button>
  </div>
  <script src="data.js"></script>
  <script src="gestures.js"></script>
  <script src="sync.js"></script>
  <script src="login.js"></script>
  <script src="plan-engine.js"></script>
  <script src="schedule.js"></script>
  <script src="plan.js"></script>
</body>
</html>
